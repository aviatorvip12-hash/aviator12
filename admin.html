<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Admin & Server Control</title>
    <style>
        :root { --bg: #0b0e14; --card: #161b26; --green: #43a047; --red: #e53935; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; }
        h2 { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .status { font-size: 1.2rem; margin: 20px 0; color: var(--green); font-weight: bold; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-crash { background: var(--red); width: 100%; padding: 18px; font-size: 1.2rem; margin-top: 15px; }
        .btn-approve { background: var(--green); }
        .btn-reject { background: var(--red); }
        .req-item { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .req-info { font-size: 0.85rem; line-height: 1.4; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px; color: #e53935;">✈️ AVIATOR MASTER ADMIN PANEL</h1>

    <div class="grid">
        <!-- Game Control Panel -->
        <div class="card" style="text-align: center;">
            <h2>গেম কন্ট্রোল সার্ভার</h2>
            <div class="status" id="server-status">Status: Waiting...</div>
            <button class="btn btn-crash" id="force-crash-btn">🔥 FORCE CRASH NOW</button>
        </div>

        <!-- Deposit Requests Panel -->
        <div class="card">
            <h2>ডিপোজিট রিকোয়েস্ট (Deposit Requests)</h2>
            <div id="dep-list">কোনো পেন্ডিং ডিপোজিট নেই</div>
        </div>

        <!-- Withdraw Requests Panel -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>উইথড্র রিকোয়েস্ট (Withdraw Requests)</h2>
            <div id="with-list">কোনো পেন্ডিং উইথড্র নেই</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyTOnCm5IuPcB-yvGjFl3KbwRVxNrcNSY",
            authDomain: "ff-to-gaming-4ea1b.firebaseapp.com",
            databaseURL: "https://ff-to-gaming-4ea1b-default-rtdb.firebaseio.com",
            projectId: "ff-to-gaming-4ea1b",
            storageBucket: "ff-to-gaming-4ea1b.appspot.com",
            messagingSenderId: "816776130875",
            appId: "1:816776130875:web:c3e7984e0de53cbd89871e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isForceCrashed = false;
        let gameLoopActive = false;
        const serverStatus = document.getElementById('server-status');
        const forceCrashBtn = document.getElementById('force-crash-btn');

        forceCrashBtn.addEventListener('click', () => { isForceCrashed = true; });

        // ক্যাসিনো ফেয়ার অ্যালগরিদম (সর্বোচ্চ ২০০x - ৫০০x ক্যাপ)
        function generateCrashPoint() {
            const rand = Math.random() * 100;
            if (rand < 5) return 1.00; // 5% ইনস্ট্যান্ট ক্র্যাশ
            if (rand < 60) return parseFloat((1 + Math.random() * 0.5).toFixed(2)); // 55% (1.01x - 1.50x)
            if (rand < 85) return parseFloat((1.51 + Math.random() * 1.49).toFixed(2)); // 25% (1.51x - 3.00x)
            if (rand < 97) return parseFloat((3.01 + Math.random() * 16.99).toFixed(2)); // 12% (3.01x - 20.00x)
            return parseFloat((20.01 + Math.random() * 480).toFixed(2)); // 3% (20x - 500x)
        }

        async function runAutoGameLoop() {
            if (gameLoopActive) return;
            gameLoopActive = true;

            while (true) {
                isForceCrashed = false;
                serverStatus.innerText = "Status: Waiting / Fast Countdown...";
                
                // ১. দ্রুততম ৩ সেকেন্ডের মধ্যে ৫,৪,৩,২,১ কাউন্টডাউন শেষ
                const waitStart = Date.now();
                await set(ref(db, 'gameState'), { status: 'waiting', waitStartTime: waitStart });
                await new Promise(r => setTimeout(r, 3000)); // ৩ সেকেন্ড ওয়েটিং

                // ২. গেম রান শুরু
                const crashPoint = generateCrashPoint();
                const startTime = Date.now();
                serverStatus.innerText = "Status: Plane Flying (Live)";

                // ডাটাবেসে শুধু ১ বার বার্তা পাঠানো (কোনো রিয়েল-টাইম লুপ মেসেজিং নেই)
                await set(ref(db, 'gameState'), { status: 'running', crashPoint: crashPoint, startTime: startTime });

                // ৩. সার্ভার ফ্লাইট টাইম গণনা করে ব্যাকগ্রাউন্ডে ওয়েট করবে
                let targetDuration = (Math.pow((crashPoint - 1) / 0.12, 1 / 1.7)) * 1000;
                let elapsed = 0;

                while (elapsed < targetDuration && !isForceCrashed) {
                    await new Promise(r => setTimeout(r, 100));
                    elapsed = Date.now() - startTime;
                }

                // ৪. ক্র্যাশ স্টেট সেট
                let finalMult = crashPoint;
                if (isForceCrashed) {
                    let calcElapsed = (Date.now() - startTime) / 1000;
                    finalMult = parseFloat((1 + Math.pow(calcElapsed, 1.7) * 0.12).toFixed(2));
                }

                serverStatus.innerText = "Status: CRASHED!";
                await set(ref(db, 'gameState'), { status: 'crashed', multiplier: finalMult });
                await new Promise(r => setTimeout(r, 2500));
            }
        }

        runAutoGameLoop();

        // Deposit Manager
        onValue(ref(db, 'depositRequests'), (snapshot) => {
            const depList = document.getElementById('dep-list');
            depList.innerHTML = '';
            const data = snapshot.val();
            if (!data) return depList.innerText = 'কোনো পেন্ডিং ডিপোজিট নেই';

            Object.keys(data).forEach(key => {
                const req = data[key];
                if (req.status === 'pending') {
                    const div = document.createElement('div');
                    div.className = 'req-item';
                    div.innerHTML = `
                        <div class="req-info">
                            <b>User:</b> ${req.email}<br>
                            <b>Amount:</b> ৳${req.amount} | <b>TrxID:</b> ${req.trxId}
                        </div>
                        <div>
                            <button class="btn btn-approve" onclick="approveDep('${key}', '${req.uid}', ${req.amount})">Approve</button>
                            <button class="btn btn-reject" onclick="rejectReq('depositRequests', '${key}')">Reject</button>
                        </div>
                    `;
                    depList.appendChild(div);
                }
            });
        });

        // Withdraw Manager
        onValue(ref(db, 'withdrawRequests'), (snapshot) => {
            const withList = document.getElementById('with-list');
            withList.innerHTML = '';
            const data = snapshot.val();
            if (!data) return withList.innerText = 'কোনো পেন্ডিং উইথড্র নেই';

            Object.keys(data).forEach(key => {
                const req = data[key];
                if (req.status === 'pending') {
                    const div = document.createElement('div');
                    div.className = 'req-item';
                    div.innerHTML = `
                        <div class="req-info">
                            <b>User:</b> ${req.email}<br>
                            <b>Amount:</b> ৳${req.amount} | <b>To:</b> ${req.receiver}
                        </div>
                        <div>
                            <button class="btn btn-approve" onclick="approveWith('${key}')">Approve Paid</button>
                            <button class="btn btn-reject" onclick="rejectWith('${key}', '${req.uid}', ${req.amount})">Refund & Reject</button>
                        </div>
                    `;
                    withList.appendChild(div);
                }
            });
        });

        window.approveDep = async (key, uid, amount) => {
            await runTransaction(ref(db, `users/${uid}/balance`), (b) => (b || 0) + amount);
            await remove(ref(db, `depositRequests/${key}`));
        };

        window.rejectReq = async (path, key) => {
            await remove(ref(db, `${path}/${key}`));
        };

        window.approveWith = async (key) => {
            await remove(ref(db, `withdrawRequests/${key}`));
        };

        window.rejectWith = async (key, uid, amount) => {
            await runTransaction(ref(db, `users/${uid}/balance`), (b) => (b || 0) + amount);
            await remove(ref(db, `withdrawRequests/${key}`));
        };
    </script>
</body>
</html>
